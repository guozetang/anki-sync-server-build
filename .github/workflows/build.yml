name: Build Anki sync server for Mac mini

on:
  workflow_dispatch:
    inputs:
      anki_version:
        description: 'Official Anki release tag matching your clients, e.g. 25.09.2 (not main)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anki-dockerhub-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      ANKI_VERSION: ${{ inputs.anki_version }}
      DOCKERHUB_IMAGE: guozetang/anki-sync-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version and determine image tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ANKI_VERSION" =~ ^[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || {
            echo 'Enter a release tag such as 25.09.2, not main or a URL.' >&2
            exit 1
          }
          echo "tag=${ANKI_VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Check out official build files at the selected Anki release
        uses: actions/checkout@v7
        with:
          repository: ankitects/anki
          ref: refs/tags/${{ inputs.anki_version }}
          path: upstream
          persist-credentials: false

      - name: Record official source revision
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream rev-parse HEAD > upstream-revision.txt
          test -f upstream/docs/syncserver/Dockerfile
          test -f upstream/docs/syncserver/entrypoint.sh

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build official ARM64 image on GitHub
        uses: docker/build-push-action@v7
        with:
          context: upstream/docs/syncserver
          file: upstream/docs/syncserver/Dockerfile
          platforms: linux/arm64
          load: true
          tags: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.tag }}
          build-args: ANKI_VERSION=${{ inputs.anki_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.anki_version }}
          cache-from: type=gha,scope=anki-arm64-${{ inputs.anki_version }}
          cache-to: type=gha,mode=max,scope=anki-arm64-${{ inputs.anki_version }}

      - name: Check server starts with disposable data
        env:
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.tag }}
        run: bash scripts/smoke.sh "$IMAGE"

      - name: Publish tested version and latest tags
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$DOCKERHUB_IMAGE:$VERSION_TAG"
          docker tag "$DOCKERHUB_IMAGE:$VERSION_TAG" "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:latest"
          {
            echo '## Published ARM64 image'
            echo
            echo "Version: $DOCKERHUB_IMAGE:$VERSION_TAG"
            echo "Current: $DOCKERHUB_IMAGE:latest"
            echo "Official source commit: $(cat upstream-revision.txt)"
            echo
            echo 'Pull on Mac mini, then recreate only Anki with its existing data mounts.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: upstream-revision-${{ steps.version.outputs.tag }}
          path: upstream-revision.txt
